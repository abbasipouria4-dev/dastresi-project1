<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سایت</title>
    <link rel="shortcut icon" href="./images/header/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/setting.css">
    <link rel="stylesheet" href="./css/vorod.css">
</head>
<body>
    <div class="login-overlay">
        <div class="login-modal">
            <a href="index.html" class="close-btn">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#666" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </a>
            <div class="login-logo">
                <img src="./images/header/logo.png" alt="دسترسی">
            </div>
            <div class="login-divider"></div>
            <h2 class="login-title">ورود و ثبت‌نام در سایت</h2>
            <p class="login-desc">برای ورود و یا ثبت‌نام در سایت، لطفا شماره موبایل خود را وارد نمایید.</p>
            <form action="#" class="login-form">
                <label class="input-label">شماره موبایل</label>
                <input type="text" class="mobile-input" placeholder="">
                
                <button type="button" class="login-submit-btn">ورود به سایت</button>
            </form>
            <p class="login-rules">ورود شما به معنای پذیرش <a href="#">شرایط و قوانین</a> سایت است.</p>

        </div>
    </div>

</body>
</html>
